name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Ensure Flutter platform folders exist
        run: |
          if [ ! -d "android" ]; then
            echo "android/ folder missing — running flutter create..."
            flutter create . --project-name agent_city --org com.agentcity --platforms=android
          else
            echo "android/ folder already exists"
          fi

      - name: Enable core library desugaring
        run: |
          F=android/app/build.gradle.kts
          [ -f "$F" ] || F=android/app/build.gradle
          python3 - "$F" <<'EOF'
          import sys, re
          p = sys.argv[1]
          s = open(p).read()
          kts = p.endswith('.kts')
          flag = 'isCoreLibraryDesugaringEnabled = true' if kts else 'coreLibraryDesugaringEnabled true'
          dep = ('coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
                 if kts else 'coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"')
          s = re.sub(r'compileOptions\s*\{', 'compileOptions {\n        ' + flag, s, count=1)
          if re.search(r'^dependencies\s*\{', s, re.M):
              s = re.sub(r'^dependencies\s*\{', 'dependencies {\n    ' + dep, s, count=1, flags=re.M)
          else:
              s += '\ndependencies {\n    ' + dep + '\n}\n'
          open(p, 'w').write(s)
          EOF
          grep -n -i "desugar" "$F"

      - name: Install dependencies
        run: flutter pub get

      - name: Generate app icons
        run: |
          if grep -q flutter_launcher_icons pubspec.yaml; then
            dart run flutter_launcher_icons || true
          fi

      - name: Analyze code
        run: flutter analyze --no-fatal-infos || true

      - name: Build Release APK
        run: flutter build apk --release

      - name: List output
        run: ls -lh build/app/outputs/flutter-apk/ || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-city-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
          if-no-files-found: error
