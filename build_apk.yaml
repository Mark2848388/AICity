name: Build APK

on:
  workflow_dispatch:          # ручной запуск из вкладки Actions
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter version
        run: flutter --version

      # Если android/ios папок ещё нет — создаём
      - name: Ensure Flutter platform folders exist
        run: |
          if [ ! -d "android" ]; then
            flutter create . --project-name agent_city --org com.agentcity
          fi

      - name: Install dependencies
        run: flutter pub get

      # Генерируем иконки (если есть конфиг)
      - name: Generate app icons
        run: |
          if grep -q flutter_launcher_icons pubspec.yaml; then
            dart run flutter_launcher_icons || true
          fi

      - name: Analyze code
        run: flutter analyze --no-fatal-infos || true

      - name: Build Release APK
        run: flutter build apk --release --split-per-abi

      - name: List output
        run: ls -lh build/app/outputs/flutter-apk/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agent-city-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
          if-no-files-found: error

      # Если запушено тегом — создаём Release
      - name: Create GitHub Release with APK
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
