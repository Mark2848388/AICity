name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Ensure Flutter platform folders exist
        run: |
          if [ ! -d "android" ]; then
            echo "android/ folder missing — running flutter create..."
            flutter create . --project-name agent_city --org com.agentcity --platforms=android
          else
            echo "android/ folder already exists"
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Generate app icons
        run: |
          if grep -q flutter_launcher_icons pubspec.yaml; then
            dart run flutter_launcher_icons || true
          fi

      - name: Analyze code
        run: flutter analyze --no-fatal-infos || true

      - name: Build Release APK
        run: flutter build apk --release

      - name: List output
        run: ls -lh build/app/outputs/flutter-apk/ || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-city-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
          if-no-files-found: error
