name: agent_city
description: 3D city of AI agents that execute tasks, build Flutter projects, and deploy via GitHub Actions.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 3D
  flutter_scene: ^0.24.4
  vector_math: ^2.1.4

  # State & persistence
  provider: ^6.1.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.4
  uuid: ^4.5.1

  # Network & GitHub
  http: ^1.2.2
  dio: ^5.7.0

  # Notifications
  flutter_local_notifications: ^18.0.1

  # Utils
  intl: ^0.19.0
  collection: ^1.18.0
  archive: ^4.0.7          # нужно для flutter_scene
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/icon/
    - flutter_scene_generated/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.jpg"
  adaptive_icon_background: "#0A0A1A"
  adaptive_icon_foreground: "assets/icon/app_icon.jpg"
  min_sdk_android: 21
  remove_alpha_ios: true
